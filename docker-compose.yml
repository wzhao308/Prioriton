# See DEPLOY.md before running this. Requires a `.env` file in this same
# directory (copy .env.production.example to .env and fill it in) - Docker
# Compose loads it automatically, both for the build args below and each
# container's runtime environment.

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Derived from DOMAIN rather than duplicated in .env - see
      # .env.production.example for what DOMAIN itself does.
      PRIORITON_FRONTEND_ORIGIN: https://app.${DOMAIN}
    volumes:
      - db_data:/data
      - browser_profiles:/app/.browser_profiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: ./frontend
      args:
        # Baked into the frontend's JS bundle at build time - see
        # frontend/Dockerfile and src/api/client.ts.
        VITE_API_BASE: https://api.${DOMAIN}
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  browser_profiles:
  caddy_data:
  caddy_config:
