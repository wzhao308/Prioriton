; Runs xvfb, x11vnc, noVNC (websockify), and the backend together in one
; container so DISPLAY is naturally shared between all of them. Started in
; priority order (lower first); supervisord waits for each program to stay
; RUNNING for its startsecs before starting the next priority group, which
; is what gives the xvfb -> x11vnc -> novnc -> backend dependency chain its
; ordering without any extra wait-for-it scripting.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
; The virtual display Chromium renders into when app.browser_login.py opens
; a "headed" (headless=False) browser for interactive Gradescope/PrairieLearn
; SSO login - there's no physical screen on a VPS, this stands in for one.
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -nolisten unix
priority=10
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
; -forever: don't exit after the first viewer disconnects.
; -shared: allow more than one viewer at once (harmless for a personal deploy).
; -nopw: no separate VNC password - this port is only reachable from inside
;   the Docker network anyway (never published to the host), and the actual
;   access control is Caddy's Basic Auth in front of the whole vnc.<domain>
;   site (see ../../frontend/Caddyfile) - a second password here would just
;   be friction, not real extra security.
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet
priority=20
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
; Bridges noVNC's browser-side WebSocket client (served as static files via
; --web) to x11vnc's plain VNC socket on 5900 - this is what actually lets
; you complete SSO login from an ordinary browser tab instead of a local GUI.
command=websockify --web=/usr/share/novnc 6080 localhost:5900
priority=30
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
; Exactly one worker, always - APScheduler (app/scheduler.py) and the
; login-tracking locks in app/browser_login.py are process-global; a second
; worker would duplicate scheduled syncs and break login serialization.
; Do not add --workers > 1 here.
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
priority=40
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
